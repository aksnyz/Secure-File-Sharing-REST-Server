<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Share Server</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* --- STYLES --- */
        :root {
            --primary: #f0768b;
            --primary-dark: #d74760;
            --bg-color: #fdf2f4;
            --card-bg: #ffffff;
            --text-main: #4a4a4a;
            --border-radius: 15px;
            --btn-radius: 25px;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center; /* Center vertically for login */
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 30px rgba(240, 118, 139, 0.15);
            position: relative;
            transition: all 0.3s ease;
        }

        /* Nav Buttons (Top Corners) */
        .top-btn {
            position: absolute;
            top: 20px;
            background: transparent;
            border: 1px solid #ddd;
            color: #888;
            font-size: 0.8em;
            padding: 5px 12px;
            box-shadow: none;
            cursor: pointer;
            border-radius: 15px;
            transition: 0.2s;
        }
        .top-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        #btn-logout { left: 20px; }
        #btn-refresh { right: 20px; }

        h1 { color: var(--primary); text-align: center; font-weight: 600; margin-bottom: 10px; }
        h2 { color: var(--text-main); border-bottom: 2px solid #ffeef1; padding-bottom: 10px; margin-top: 30px; font-size: 1.2rem; }
        p { text-align: center; color: #888; margin-top: 0; }

        input[type="text"], input[type="password"], input[type="file"] {
            width: 100%; padding: 12px 15px; margin: 10px 0;
            border: 2px solid #ffeef1; border-radius: var(--border-radius);
            box-sizing: border-box; font-family: inherit; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 8px rgba(240, 118, 139, 0.2); }

        /* Main Buttons */
        .btn-main {
            background-color: var(--primary); color: white; padding: 12px 24px;
            border: none; border-radius: var(--btn-radius); cursor: pointer;
            font-weight: 600; font-family: inherit; transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(240, 118, 139, 0.3);
            width: 100%; margin-top: 10px;
        }
        .btn-main:hover { background-color: var(--primary-dark); transform: translateY(-2px); }

        /* Small Buttons (List) */
        .btn-small {
            background-color: var(--primary); color: white; padding: 6px 12px;
            border: none; border-radius: 15px; cursor: pointer; font-size: 0.85em;
            margin-left: 5px;
        }
        .btn-outline { background-color: transparent; border: 1px solid var(--primary); color: var(--primary); }
        .btn-outline:hover { background-color: var(--primary); color: white; }

        /* List Styles */
        ul { padding: 0; list-style-type: none; }
        .file-entry {
            background: #fff; border: 1px solid #ffeef1; border-radius: var(--border-radius);
            padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between;
            align-items: center; transition: 0.2s;
        }
        .file-entry:hover { border-color: var(--primary); transform: scale(1.005); }
        .file-info b { color: var(--text-main); display: block; }
        .file-info span { font-size: 0.85em; color: #999; }

        /* Toggle Link */
        .toggle-link {
            text-align: center; margin-top: 15px; font-size: 0.9em; cursor: pointer; color: #888;
        }
        .toggle-link span { color: var(--primary); font-weight: 600; text-decoration: underline; }

        .hidden { display: none !important; }
        .status-msg { text-align: center; margin-top: 10px; font-size: 0.9em; min-height: 20px; }
    </style>
</head>
<body>

<div id="auth-view" class="container">
    <h1>Welcome</h1>
    <p id="auth-subtitle">Please log in to continue</p>

    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">

    <button id="auth-btn" class="btn-main" onclick="handleAuth()">Login</button>
    <div id="auth-status" class="status-msg"></div>

    <div class="toggle-link" onclick="toggleAuthMode()">
        <div id="toggle-text">Don't have an account? <span>Register here</span></div>
    </div>
</div>

<div id="app-view" class="container hidden">
    <button id="btn-logout" class="top-btn" onclick="logout()">Log out</button>
    <button id="btn-refresh" class="top-btn" onclick="refreshToken()">Refresh Token</button>

    <h1>File Sharing Server</h1>
    <p>Secure & Pink Storage</p>

    <h2>Upload File</h2>
    <div style="background: #fdf2f4; padding: 20px; border-radius: 15px; border: 2px dashed #f0768b; text-align: center;">
        <input type="file" id="file-input" style="border: none;">
        <button class="btn-main" onclick="uploadFile()">Upload to Server</button>
    </div>
    <div id="upload-status" class="status-msg"></div>

    <h2>Your Files</h2>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <span style="color:#888; font-size: 0.9em;">Manage your files</span>
        <button onclick="listFiles()" class="btn-small btn-outline">Refresh List</button>
    </div>

    <div id="file-list-status" class="status-msg"></div>
    <ul id="file-list"></ul>
</div>

<script>
    let JWT_TOKEN = localStorage.getItem('jwt_token') || null;
    let isRegisterMode = false;

    // On Load: Check if logged in
    if (JWT_TOKEN) {
        showAppView();
    }

    // --- VIEW MANAGEMENT ---
    function showAppView() {
        document.getElementById('auth-view').classList.add('hidden');
        document.getElementById('app-view').classList.remove('hidden');
        document.body.style.alignItems = "flex-start"; // Align to top for long content
        listFiles();
    }

    function showAuthView() {
        document.getElementById('app-view').classList.add('hidden');
        document.getElementById('auth-view').classList.remove('hidden');
        document.body.style.alignItems = "center"; // Center for login
        // Reset form
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
        document.getElementById('auth-status').textContent = '';
    }

    function toggleAuthMode() {
        isRegisterMode = !isRegisterMode;
        const btn = document.getElementById('auth-btn');
        const toggleText = document.getElementById('toggle-text');
        const title = document.querySelector('#auth-view h1');
        const subtitle = document.getElementById('auth-subtitle');

        if (isRegisterMode) {
            // Change to Register Mode
            btn.textContent = "Register";
            title.textContent = "Create Account";
            subtitle.textContent = "Enter your details below"; // ZMIANA TEKSTU
            toggleText.innerHTML = "Already have an account? <span>Login here</span>";
        } else {
            // Change to Login Mode
            btn.textContent = "Login";
            title.textContent = "Welcome";
            subtitle.textContent = "Please log in to continue"; // ZMIANA TEKSTU
            toggleText.innerHTML = "Don't have an account? <span>Register here</span>";
        }
    }

    function logout() {
        JWT_TOKEN = null;
        localStorage.removeItem('jwt_token');
        showAuthView();
    }

    function updateStatus(elementId, message, color) {
        const el = document.getElementById(elementId);
        el.textContent = message;
        el.style.color = color === 'blue' ? '#f0768b' : color;
    }

    // --- API FUNCTIONS ---

    async function handleAuth() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const endpoint = isRegisterMode ? '/register' : '/login';

        if(!username || !password) return updateStatus('auth-status', 'Fill in all fields', '#ff4444');

        try {
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const text = await response.text();
            let data = {}; try { data = JSON.parse(text); } catch(e) {}

            if (response.ok) {
                if (isRegisterMode) {
                    // Registration successful -> Switch to login mode
                    alert("Registration successful! Please log in.");
                    toggleAuthMode();
                    updateStatus('auth-status', 'Account created. Log in now.', '#4CAF50');
                } else {
                    // Login successful
                    if (data.token) {
                        JWT_TOKEN = data.token;
                        localStorage.setItem('jwt_token', JWT_TOKEN);
                        showAppView();
                    }
                }
            } else {
                updateStatus('auth-status', `Error: ${text}`, '#ff4444');
            }
        } catch (error) {
            updateStatus('auth-status', `Network Error: ${error.message}`, '#ff4444');
        }
    }

    async function refreshToken() {
        if (!JWT_TOKEN) return logout();
        try {
            const response = await fetch('/token/refresh', {
                method: 'GET',
                headers: { 'Authorization': `Bearer ${JWT_TOKEN}` }
            });
            if (response.ok) {
                const data = await response.json();
                if (data.token) {
                    JWT_TOKEN = data.token;
                    localStorage.setItem('jwt_token', JWT_TOKEN);
                    alert("Session extended successfully! (Token Refreshed)");
                }
            } else {
                alert("Session expired. Please log in again.");
                logout();
            }
        } catch (e) { alert("Error: " + e.message); }
    }

    async function uploadFile() {
        const fileInput = document.getElementById('file-input');
        const file = fileInput.files[0];
        if (!file) return updateStatus('upload-status', 'Please select a file.', '#ff4444');

        const formData = new FormData();
        formData.append('file', file);
        formData.append('filename', file.name);

        try {
            updateStatus('upload-status', 'Uploading...', '#f0768b');
            const response = await fetch('/file/upload', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${JWT_TOKEN}` },
                body: formData
            });

            if (response.ok) {
                updateStatus('upload-status', 'File uploaded successfully!', '#4CAF50');
                fileInput.value = '';
                listFiles();
            } else {
                updateStatus('upload-status', `Error: ${await response.text()}`, '#ff4444');
            }
        } catch (error) {
            updateStatus('upload-status', `Error: ${error.message}`, '#ff4444');
        }
    }

    async function listFiles() {
        const listUl = document.getElementById('file-list');
        listUl.innerHTML = '';

        try {
            const response = await fetch('/file/list', {
                method: 'GET',
                headers: { 'Authorization': `Bearer ${JWT_TOKEN}` }
            });

            if (response.ok) {
                const files = await response.json();
                updateStatus('file-list-status', `Files found: ${files.length}`, '#4CAF50');

                files.forEach(file => {
                    const li = document.createElement('li');
                    li.className = 'file-entry';

                    let publicControls = '';
                    if (file.visibility === 'public') {
                        const publicLink = `${window.location.origin}/file/public/${file.id}`;
                        publicControls = `
                                <div style="margin-top:5px; font-size:0.8em; color:var(--primary);">
                                    Public Link: <a href="${publicLink}" target="_blank" style="color:var(--primary-dark);">${publicLink}</a>
                                </div>
                            `;
                    } else {
                        // CLEAN MAKE PUBLIC BUTTON (No emoji, normal style)
                        publicControls = `
                                <button onclick="makePublic(${file.id})" class="btn-small btn-outline">Make Public</button>
                            `;
                    }

                    li.innerHTML = `
                            <div class="file-info" style="flex-grow:1;">
                                <b>${file.name}</b>
                                <span>ID: ${file.id} | Status: ${file.visibility || 'private'}</span>
                                ${publicControls}
                            </div>
                            <div style="display:flex; flex-direction:column; gap:5px; margin-left:10px;">
                                <button onclick="shareFile(${file.id})" class="btn-small btn-outline">Share</button>
                                <button onclick="revokeFile(${file.id})" class="btn-small btn-outline" style="border-color: #ff4444; color: #ff4444;">Unshare</button>
                                <button onclick="downloadFile(${file.id})" class="btn-small">Download</button>
                            </div>
                        `;
                    listUl.appendChild(li);
                });
            } else {
                updateStatus('file-list-status', 'Failed to fetch list.', '#ff4444');
            }
        } catch (error) {
            updateStatus('file-list-status', `Error: ${error.message}`, '#ff4444');
        }
    }

    async function shareFile(fileId) {
        const targetUser = prompt("Who do you want to share this file with? (Enter username):");
        if (!targetUser) return;

        try {
            const response = await fetch('/file/share', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${JWT_TOKEN}`
                },
                body: JSON.stringify({ file_id: fileId, target_username: targetUser })
            });

            const text = await response.text();
            if (response.ok) {
                alert("Success: File shared!");
            } else {
                alert("Error: " + text);
            }
        } catch (error) {
            alert("Network Error: " + error.message);
        }
    }

    async function revokeFile(fileId) {
        const targetUser = prompt("Revoke access from whom? (Enter username):");
        if (!targetUser) return;

        try {
            const response = await fetch(`/file/${fileId}/share/${targetUser}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${JWT_TOKEN}` }
            });

            const text = await response.text();
            if (response.ok) {
                alert("Success: Permission revoked!");
            } else {
                alert("Error: " + text);
            }
        } catch (error) {
            alert("Network Error: " + error.message);
        }
    }

    async function makePublic(fileId) {
        if (!confirm("Are you sure? Anyone with the link will be able to download this file.")) return;

        try {
            const response = await fetch(`/file/${fileId}/make_public`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${JWT_TOKEN}` }
            });

            const text = await response.text();
            if (response.ok) {
                alert("Success: File is now public!");
                listFiles();
            } else {
                alert("Error: " + text);
            }
        } catch (error) {
            alert("Network Error: " + error.message);
        }
    }

    function downloadFile(fileId) {
        window.location.href = `/file/download/${fileId}?token=${JWT_TOKEN}`;
    }
</script>
</body>
</html>
